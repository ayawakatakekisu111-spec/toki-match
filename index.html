// Wikipediaの公開サムネイルを取得できた場合だけ表示。失敗時はアイコン。
async function loadImages(){await Promise.all(people.map(async(p)=>{try{const title=p.name==='千代（見性院）'?'見性院 (山内一豊室)':p.name==='牧村兵部'?'牧村利貞':p.name;const url='https://ja.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(title)+'&prop=pageimages&format=json&pithumbsize=600&origin=*';const res=await fetch(url);const json=await res.json();const page=Object.values(json.query.pages)[0];if(page.thumbnail?.source)imgs[p.name]=page.thumbnail.source}catch(e){}}));if(mode==='browse')render()}
function portrait(p,i){const c=colors[i%colors.length];return `<div class="portrait" style="--a:${c[0]};--b:${c[1]}">${imgs[p.name]?`<img src="${imgs[p.name]}" alt="${p.name}の肖像または関連画像" loading="lazy" onerror="this.style.display='none'">`:`<span class="avatar">${p.emoji}</span>`}<span class="era">${p.code} · ${p.era}</span></div>`}
function render(){if(mode==='signup'){renderSignup();return}if(mode==='quiz'){renderQuiz();return}let list=people.filter(p=>(regionFilter==='all'||p.region===regionFilter)&&(countryFilter==='all'||p.country===countryFilter)&&(filter==='all'||(filter==='likes'?liked.has(p.name):p.gender===filter)));if(profile&&filter!=='likes')list.sort((a,b)=>compat(b)-compat(a));app.innerHTML=`<div class="memberbar"><span>♥ ${escapeHtml(profile?.name||'ゲスト')}さんのおすすめ会員</span><button onclick="editProfile()">⚙ 好みを変更</button></div><section class="hero"><div style="color:#dc3670;font-weight:800;font-size:12px">歴史人物専門マッチングアプリ</div><h1>時代を超えて、恋しよう。♥</h1><p>平安貴族から幕末の志士まで。気になる相手をタップして、秘密のプロフィールを覗いてみよう。</p><p>登録者${people.length}人 ｜ あなたの好みに合わせておすすめ順に表示 ｜ 既読は数百年待ち</p><p style="font-size:12px">※生年月日は不詳・推定・旧暦の区別を表示。史実と創作セリフは別です。</p><button class="action" style="width:auto" onclick="startQuiz()">10問で運命の相手を診断 →</button></section><div class="tools"><button class="tab ${filter==='all'?'active':''}" onclick="setFilter('all')">全員 ${people.length}</button><button class="tab ${filter==='m'?'active':''}" onclick="setFilter('m')">男性 ${people.filter(p=>p.gender==='m').length}</button><button class="tab ${filter==='f'?'active':''}" onclick="setFilter('f')">女性 ${people.filter(p=>p.gender==='f').length}</button><button class="tab ${filter==='likes'?'active':''}" onclick="setFilter('likes')">♥ いいね ${liked.size}</button></div><div class="tools" style="margin-top:0"><select aria-label="地域で探す" onchange="regionFilter=this.value;countryFilter='all';render()"><option value="all" ${regionFilter==='all'?'selected':''}>🌏 すべての地域</option>${['日本','アジア','ヨーロッパ'].map(r=>`<option ${regionFilter===r?'selected':''} value="${r}">${r}</option>`).join('')}</select><select aria-label="国で探す" onchange="countryFilter=this.value;render()"><option value="all">すべての国</option>${[...new Set(people.filter(p=>regionFilter==='all'||p.region===regionFilter).map(p=>p.country))].map(c=>`<option value="${c}" ${countryFilter===c?'selected':''}>${isoCodes[c]||"—"} · ${c}</option>`).join('')}</select></div><div class="grid">${list.map(p=>{const i=people.indexOf(p);return `<article class="person" onclick="detail(${i})">${portrait(p,i)}<div class="body"><h3>${p.name}</h3><span class="matchbadge">♥ 相性 ${compat(p)}%</span><p>${escapeHtml(p.intro)}</p><p class="dob">🎂 ${escapeHtml(p.birthday)}</p><p class="achieve">🏆 ${escapeHtml(p.achievement)}</p><div class="bottom"><span class="more">プロフィールを見る ›</span><button aria-label="いいね" class="like ${liked.has(p.name)?'on':''}" onclick="event.stopPropagation();toggleLike(${i})">♥</button></div></div></article>`}).join('')}</div>${list.length?'':'<div class="empty">まだいいねした人はいません。気になる人に♥を押してみて！</div>'}`}
function setFilter(f){filter=f;render()}
function toggleLike(i){const p=people[i];if(liked.has(p.name)){liked.delete(p.name);toast('いいねを取り消しました')}else{liked.add(p.name);toast(p.name+'にいいねしました ♥ プロフィールからトークできます')}render()}
function detail(i,score){const p=people[i];if(score===undefined)score=compat(p);document.getElementById('modal').innerHTML=`<button class="close" onclick="closeDetail()" aria-label="閉じる">×</button>${portrait(p,i)}<div class="info"><div class="subtitle">${p.code} · ${p.era} · ${p.gender==='m'?'男性':'女性'}${score!==undefined?' · 相性 '+score+'%':''}</div><h2>${p.name} <span style="color:#e73c77">♥</span></h2><div>${p.tag}</div><div class="quote">${escapeHtml(p.intro)}</div><div class="section"><strong>🎂 生年月日</strong>${escapeHtml(p.birthday)}</div><div class="section"><strong>🏆 実績・アピールポイント</strong>${escapeHtml(p.achievement)}</div><div class="section"><strong>自己紹介</strong>${escapeHtml(p.intro)}</div><div class="section"><strong>📍 活動地域</strong>${p.code} ／ ${escapeHtml(p.country)} ／ ${escapeHtml(p.era)}</div><div class="section"><strong>⚠ 交際上の注意</strong>${p.warning}</div><div class="section"><strong>好きなタイプ（創作）</strong>${p.v[0]>=5?'知的な会話を楽しめる人。':'自分の価値観を尊重してくれる人。'} ${p.v[2]>=5?'信頼関係を大切にする人。':'刺激や変化を楽しめる人。'}</div><button class="action" onclick="match(${i})">♥ ${liked.has(p.name)?'トークを開く':'いいねしてマッチする'}</button><button class="action secondary" onclick="closeDetail()">一覧に戻る</button></div>`;document.getElementById('overlay').classList.add('show')}
function closeDetail(){document.getElementById('overlay').classList.remove('show')}
function match(i){const p=people[i];liked.add(p.name);closeDetail();render();showChat(i)}

function showChat(i){
const p=people[i],key='toki_chat_'+p.name,day=new Date().toISOString().slice(0,10);
let history=[];try{history=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
if(!history.length)history=[{from:'them',text:'マッチありがとうございます！よかったら、まずはお互いのことを少し話しませんか？',synthetic:true}];
let sending=false;
function used(){try{let q=JSON.parse(localStorage.getItem('toki_daily_ai')||'{}');return q.day===day?q.count||0:0}catch(e){return 0}}
function increment(){try{let q=JSON.parse(localStorage.getItem('toki_daily_ai')||'{}');localStorage.setItem('toki_daily_ai',JSON.stringify({day,count:(q.day===day?q.count||0:0)+1}))}catch(e){}}
function save(){try{localStorage.setItem(key,JSON.stringify(history.slice(-40)))}catch(e){}}
function draw(){const remaining=Math.max(0,20-used());document.getElementById('modal').innerHTML=`<button class="close" onclick="closeDetail()">×</button><div class="info"><h2>💌 ${escapeHtml(p.name)}とのトーク</h2><p class="subtitle">${p.code} · ${escapeHtml(p.era)} · 🎂 ${escapeHtml(p.birthday)}</p><p style="font-size:12px;color:#85566b">AIとの創作会話 · 今日あと${remaining}通（全人物合計） · サイト全体400通/日</p><div class="chatlog" id="aiChatLog">${history.map(m=>`<div class="bubble ${m.from==='me'?'me':'them'}">${escapeHtml(m.text)}</div>`).join('')}</div><form id="aiChatForm" style="display:flex;gap:8px;margin:12px 0"><input id="aiChatInput" maxlength="400" autocomplete="off" placeholder="${remaining?'メッセージを入力…':'本日の上限に達しました'}" style="min-width:0;flex:1;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px" ${remaining===0||sending?'disabled':''}><button type="submit" class="action" style="width:auto;padding:10px 15px" ${remaining===0||sending?'disabled':''}>${sending?'送信中…':'送信'}</button></form><p id="aiChatError" style="color:#a63753;font-size:12px"></p><button class="action secondary" onclick="detail(${i})">プロフィールに戻る</button></div>`;document.getElementById('overlay').classList.add('show');const log=document.getElementById('aiChatLog');log.scrollTop=log.scrollHeight;document.getElementById('aiChatForm').onsubmit=async(e)=>{e.preventDefault();if(sending||used()>=20)return;const input=document.getElementById('aiChatInput');const message=input.value.trim();if(!message)return;sending=true;history.push({from:'me',text:message});save();draw();try{const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:{name:p.name,era:p.era,tag:p.tag,fact:p.fact,achievement:p.achievement,quote:p.quote,warning:p.warning},history:history.slice(-13,-1).filter(m=>!m.synthetic).map(m=>({role:m.from==='me'?'user':'model',text:m.text})),message})});const data=await res.json();if(!res.ok)throw new Error(data.error||'AIが応答できませんでした');history.push({from:'them',text:data.reply});increment();save()}catch(err){history.pop();save();window.alert(err.message)}finally{sending=false;draw()}}}
draw()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),4200)}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

const traitNames=['知的で会話が面白い','情熱的で刺激的','誠実で一途','野心家で頼もしい','個性的で自由','裕福で華やか'];
function escapeHtml(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function compat(p){if(!profile)return 75;const target=profile.traits||[];let points=0;for(const n of target)points+=(p.v[n]-1)*3;return Math.min(99,Math.max(62,68+Math.round(points/(Math.max(1,target.length)))))}
function editProfile(){draft={gender:profile?.gender||'m',traits:[...(profile?.traits||[])],name:profile?.name||''};signupStep=0;mode='signup';render();window.scrollTo(0,0)}
function setGender(g){draft.gender=g;render()}
function toggleTrait(i){draft.traits=draft.traits.includes(i)?draft.traits.filter(x=>x!==i):draft.traits.length<3?[...draft.traits,i]:draft.traits;render()}
function chooseSignup(field,value){draft[field]=value;render()}
function signupOptions(field,options){return `<div class="choice-grid">${options.map(([v,label])=>`<button class="choice ${draft[field]===v?'selected':''}" onclick="chooseSignup('${field}','${v}')">${label}</button>`).join('')}</div>`}
function signupNav(next){return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="action" style="flex:2" onclick="signupStep=${next};render();window.scrollTo(0,0)">次へ →</button>${signupStep>0?`<button class="action secondary" style="flex:1" onclick="signupStep=${signupStep-1};render();window.scrollTo(0,0)">← 戻る</button>`:''}</div>`}
function renderSignup(){let body='';
if(signupStep===0)body=`<h1>あなたの理想の出会いを。</h1><p>まずは、どんなお相手と出会いたいか教えてください。</p><label>お相手の性別</label>${signupOptions('gender',[['m','男性'],['f','女性'],['all','こだわらない']])}${signupNav(1)}`;
if(signupStep===1)body=`<h1>どんな関係を探している？</h1><p>マッチングアプリらしく、恋愛の目的から考えてみよう。</p><label>希望する関係</label>${signupOptions('relationship',[['serious','💍 将来を見据えた真剣な恋愛'],['romance','💕 ときめく恋愛を楽しみたい'],['casual','☕ まずは友達から'],['adventure','✨ 刺激的な出会いを探したい']])}${signupNav(2)}`;
if(signupStep===2)body=`<h1>惹かれるのはどんな人？</h1><p>理想のお相手に求める魅力を最大3つ選んでね。おすすめ順に反映されるよ。</p><div class="choice-grid">${traitNames.map((t,i)=>`<button class="choice ${draft.traits.includes(i)?'selected':''}" onclick="toggleTrait(${i})">${draft.traits.includes(i)?'♥ ':'♡ '}${t}</button>`).join('')}</div><p class="muted">${draft.traits.length}/3 選択中</p><button class="action" onclick="if(!draft.traits.length){toast('1つ以上選んでね');return}signupStep=3;render();window.scrollTo(0,0)">次へ →</button><button class="action secondary" onclick="signupStep=1;render()">← 戻る</button>`;
if(signupStep===3)body=`<h1>恋愛のペースは？</h1><p>お互いの距離感も、大切な相性のひとつ。</p><label>理想の進展スピード</label>${signupOptions('pace',[['slow','🌷 ゆっくり信頼を深めたい'],['normal','💬 まずは会話を重ねたい'],['fast','🔥 フィーリングが合えば積極的に']])}${signupNav(4)}`;
if(signupStep===4)body=`<h1>理想の初デートは？</h1><p>時代を超えたデートなら、どれを選ぶ？</p><label>初デートの過ごし方</label>${signupOptions('date',[['culture','🎨 美術館や観劇を楽しむ'],['food','🍽️ おいしいものを食べながら話す'],['outdoor','🌿 散歩や旅で一緒に冒険する'],['luxury','🏰 特別感のある華やかなデート']])}${signupNav(5)}`;
if(signupStep===5)body=`<h1>最後に、あなたの名前は？</h1><p>あなたの恋活プロフィールを完成させよう。</p><label for="nick">ニックネーム（省略可）</label><input id="nick" type="text" maxlength="24" placeholder="例：歴史好きさん" value="${escapeHtml(draft.name)}" oninput="draft.name=this.value"><p class="muted">※メールアドレス不要。登録情報はこのブラウザ内だけに保存されます。歴史人物との恋愛・会話はフィクションです。</p><button class="action" onclick="completeSignup()">♥ 登録してお相手を見る</button><button class="action secondary" onclick="draft.name=document.getElementById('nick').value;signupStep=4;render()">← 戻る</button>`;
app.innerHTML=`<div class="signup"><div class="progress">♥ TOKI MATCH ｜ プロフィール作成 ${signupStep+1} / 6</div><div style="height:5px;background:#f4d9e5;border-radius:10px;overflow:hidden;margin:12px 0 22px"><div style="height:100%;width:${(signupStep+1)/6*100}%;background:#dc3670;border-radius:10px"></div></div>${body}</div>`}
function completeSignup(){draft.name=document.getElementById('nick').value.trim()||'歴史好き';profile={...draft};try{localStorage.setItem('toki_profile_v1',JSON.stringify(profile))}catch(e){}filter=profile.gender==='all'?'all':profile.gender;mode='browse';render();window.scrollTo(0,0);toast('会員登録完了！あなたにおすすめの人物を表示中 ♥')}

const questions=[
['理想の相手は？',['頭がよくて話が面白い','誠実で安心できる','情熱的で刺激的','野心があって頼もしい'],[0,2,1,3]],
['初デートなら？',['美術館や本屋','静かなカフェ','旅行や冒険','高級レストラン'],[0,2,4,5]],
['喧嘩したときは？',['論理的に話す','じっくり仲直り','勢いでぶつかる','うまく交渉する'],[0,2,1,3]],
['遠距離恋愛は？',['手紙で深く語り合う','定期的に会いたい','会いに行っちゃう','お互い自由でいたい'],[0,2,1,4]],
['恋人の夢には？',['知恵を貸す','生活を支える','一緒に挑戦する','人脈や資金で支える'],[0,2,1,5]],
['惹かれるのは？',['教養','優しさ','勇敢さ','個性的な感性'],[0,2,1,4]],
['プレゼントは？',['本や詩','手紙','思い出になる体験','豪華な贈り物'],[0,2,1,5]],
['理想の関係は？',['互いを尊敬','穏やかな家庭','刺激し合う','二人で成功する'],[0,2,1,3]],
['秘密があったら？',['詳しく聞く','話すまで待つ','ドラマチックで好き','秘密も個性'],[0,2,1,4]],
['最後に大切なのは？',['知的な絆','生涯の信頼','燃えるような恋','夢と野心'],[0,2,1,3]]];
function startQuiz(){mode='quiz';quizGender=profile?.gender==='f'?'f':'m';step=0;answers=[];render()}
function renderQuiz(){if(step===-1){app.innerHTML=`<div class="quiz"><h2>あなたの運命の相手を診断 ♥</h2><p>マッチングしたい相手を選んでね。</p><div class="options"><button class="option" onclick="quizGender='m';step=0;render()">男性から探す</button><button class="option" onclick="quizGender='f';step=0;render()">女性から探す</button></div><button class="action secondary" onclick="mode='browse';render()">一覧に戻る</button></div>`;return}if(step===10){showResult();return}const q=questions[step];app.innerHTML=`<div class="quiz"><div class="progress">QUESTION ${step+1} / 10</div><h2>${q[0]}</h2><div class="options">${q[1].map((a,i)=>`<button class="option" onclick="answers.push(${q[2][i]});step++;render()">${a}</button>`).join('')}</div><button class="action secondary" onclick="if(step>0){step--;answers.pop()}else step=-1;render()">← 戻る</button></div>`}
function showResult(){const v=[0,0,0,0,0,0];answers.forEach(i=>v[i]+=1);const candidates=people.filter(p=>profile?.gender==='all'||p.gender===quizGender).map(p=>({p,dist:p.v.reduce((s,n,i)=>s+Math.abs(n-(1+4*v[i]/Math.max(1,Math.max(...v)))),0)})).sort((a,b)=>a.dist-b.dist);const p=candidates[0].p;const score=Math.max(65,Math.min(99,Math.round(99-candidates[0].dist*1.4)));app.innerHTML=`<div class="quiz" style="text-align:center"><div class="progress">診断完了 ♥</div><h2>あなたの運命の相手は…</h2><div style="max-width:300px;margin:0 auto">${portrait(p,people.indexOf(p))}</div><h2>${p.name}</h2><p>🎂 ${escapeHtml(p.birthday)} · ${p.code}</p><div class="result">相性 <b>${score}%</b><p>${p.tag}</p></div><button class="action" onclick="detail(${people.indexOf(p)},${score})">詳しいプロフィールを見る</button><button class="action secondary" onclick="mode='browse';filter='all';render()">ほかの会員も見てみる</button><button class="action secondary" onclick="startQuiz()">もう一度診断する</button></div>`}
render(); // 画像の外部読み込みを停止し、オフラインでも起動できるようにしました。
</script></body></html>
